<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blog</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Base styles */
body {
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin: 0;
    padding: 0;
}

.container {
    width: 90%;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ccc;
}

/* Header styles */
header {
    background-color: #f4f4f4;
    color: #333;
    padding: 20px;
    text-align: center;
}

/* Column styles */
.column {
    float: left;
    width: 30%;
    margin: 1.66%;
    background-color: #e2e2e2;
    padding: 10px;
}

/* Clearfix */
.clearfix::after {
    content: "";
    display: table;
    clear: both;
}

/* Media Queries */
@media (max-width: 768px) {
    .column {
        width: 100%;
        float: none;
        margin: 0 0 20px 0;
    }
}

/* Grid styles */
.row {
    overflow: hidden;
}

/* Post styles */
.post img {
    float: left;
    width: 50%;
    margin-right: 10px;
}


    </style>


</head>
<body>
    <header>
        <h1>Welcome to the Tech Blog</h1>
    </header>
    <div class="container">
        <div class="column">
            <h2>Latest News</h2>
            <p>Stay updated with the latest tech news.</p>
        </div>
        <div class="column">
            <h2>Reviews</h2>
            <p>Read reviews of the latest gadgets.</p>
        </div>
        <div class="column">
            <h2>Tutorials</h2>
            <p>Learn how to use new tech tools.</p>
        </div>
        <div class="clearfix"></div>
    </div>
    <div class="container">
        <div class="row">
            <div class="column">Grid Item 1</div>
            <div class="column">Grid Item 2</div>
            <div class="column">Grid Item 3</div>
            <div class="clearfix"></div>
        </div>
    </div>
    <div class="container">
        <div class="post">
            <img src="https://edube.org/uploads/media/default/0001/04/service1.jpg" alt="Tech Image">
            <p>This is an example of text wrapping around an image.</p>
        </div>
    </div>
</body>
</html>
